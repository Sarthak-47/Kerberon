name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.26.6"

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build every target
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"

          # The four platforms the spec commits to. CGO stays off, which is
          # what keeps these single static files.
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            out="dist/kerberon_${GOOS}_${GOARCH}"
            [ "$GOOS" = "windows" ] && out="${out}.exe"
            echo "building $out"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags="$LDFLAGS" -o "$out" ./cmd/kerberon
          done

      - name: Report sizes against the 25 MB budget
        run: |
          set -eu
          fail=0
          for f in dist/*; do
            size=$(stat -c%s "$f")
            mb=$(awk "BEGIN {printf \"%.1f\", $size/1048576}")
            echo "$(basename "$f"): ${mb} MB"
            if [ "$size" -gt 26214400 ]; then
              echo "::error::$(basename "$f") exceeds the 25 MB budget (${mb} MB)"
              fail=1
            fi
          done
          exit "$fail"

      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false

  docker:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/kerberon:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/kerberon:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
